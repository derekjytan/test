[project]
name = "interview-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "openai>=2.0",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
